name: Deploy FactHub to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: facthub-production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify backend
        run: ./gradlew test --no-daemon

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/facthub_deploy_key
          chmod 600 ~/.ssh/facthub_deploy_key

          if ! ssh-keyscan \
            -T 10 \
            -p "$EC2_PORT" \
            -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts; then
            echo "::error::EC2 SSH 호스트에 연결하지 못했습니다. 호스트, 포트, 보안 그룹을 확인하세요."
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          ssh \
            -i ~/.ssh/facthub_deploy_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" << 'EOF'
              set -Eeuo pipefail

              cd /home/ubuntu/Post-proto

              previous_commit="$(git rev-parse HEAD)"

              rollback() {
                exit_code=$?

                if [ "$exit_code" -ne 0 ]; then
                  echo "배포 실패: 이전 커밋으로 롤백합니다."
                  git reset --hard "$previous_commit"
                  COMPOSE_BAKE=false \
                    BUILDKIT_PROGRESS=plain \
                    docker compose build backend

                  COMPOSE_BAKE=false \
                    BUILDKIT_PROGRESS=plain \
                    docker compose build frontend

                  docker compose up -d --remove-orphans
                fi

                exit "$exit_code"
              }

              trap rollback EXIT

              echo "현재 배포 커밋:"
              git rev-parse --short "$previous_commit"

              echo "최신 코드 가져오기"
              git fetch origin main
              git reset --hard origin/main

              echo "백엔드 Docker 이미지 빌드"
              COMPOSE_BAKE=false \
                BUILDKIT_PROGRESS=plain \
                docker compose build backend

              echo "프론트엔드 Docker 이미지 빌드"
              COMPOSE_BAKE=false \
                BUILDKIT_PROGRESS=plain \
                docker compose build frontend

              echo "컨테이너 실행"
              docker compose up -d --remove-orphans

              echo "서비스 헬스 체크 대기"
              for attempt in $(seq 1 24); do
                backend_health="$(
                  docker inspect \
                    --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    facthub-backend
                )"

                frontend_health="$(
                  docker inspect \
                    --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                    facthub-frontend
                )"

                if [ "$backend_health" = "healthy" ] \
                  && [ "$frontend_health" = "healthy" ]; then
                  break
                fi

                if [ "$attempt" -eq 24 ]; then
                  echo "서비스가 제한 시간 안에 healthy 상태가 되지 않았습니다."
                  docker compose logs --tail 200
                  exit 1
                fi

                sleep 5
              done

              echo "컨테이너 상태"
              docker compose ps

              echo "사용하지 않는 이미지 정리"
              docker image prune -f

              echo "배포 완료 커밋:"
              git rev-parse --short HEAD

              trap - EXIT
          EOF
