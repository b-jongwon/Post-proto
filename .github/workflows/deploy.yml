name: Deploy FactHub to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: facthub-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/facthub_deploy_key
          chmod 600 ~/.ssh/facthub_deploy_key

          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          ssh \
            -i ~/.ssh/facthub_deploy_key \
            -p "$EC2_PORT" \
            "$EC2_USER@$EC2_HOST" << 'EOF'
              set -Eeuo pipefail

              cd /home/ubuntu/Post-proto

              echo "현재 배포 커밋:"
              git rev-parse --short HEAD

              echo "최신 코드 가져오기"
              git fetch origin main
              git reset --hard origin/main

              echo "Docker 재빌드 및 실행"
              docker compose up -d --build --remove-orphans

              echo "컨테이너 상태"
              docker compose ps

              echo "사용하지 않는 이미지 정리"
              docker image prune -f

              echo "배포 완료 커밋:"
              git rev-parse --short HEAD
          EOF